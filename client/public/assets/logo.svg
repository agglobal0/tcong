<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Deep Royal Purple -->
    <linearGradient id="tcongBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7E22CE"/>
      <stop offset="50%" stop-color="#581C87"/>
      <stop offset="100%" stop-color="#2E1065"/>
    </linearGradient>

    <!-- Gold Gradient: Radiant Divine Amber/Gold -->
    <linearGradient id="tcongGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="40%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>

    <!-- Warm Divine Radial Glow behind the cross -->
    <radialGradient id="crossGlow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#FDE047" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#F59E0B" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#581C87" stop-opacity="0"/>
    </radialGradient>

    <!-- Soft Drop Shadow -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#F59E0B" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Squircle Base Canvas -->
  <rect x="16" y="16" width="480" height="480" rx="108" ry="108" fill="url(#tcongBg)" stroke="url(#tcongGold)" stroke-width="12" filter="url(#softGlow)"/>

  <!-- Inner Ambient Aura -->
  <circle cx="256" cy="216" r="170" fill="url(#crossGlow)"/>

  <!-- Divine Rays (Subtle 8-point sunburst around the intersection) -->
  <g stroke="url(#tcongGold)" stroke-width="3" stroke-linecap="round" opacity="0.4">
    <line x1="256" y1="90" x2="256" y2="120"/>
    <line x1="256" y1="312" x2="256" y2="342"/>
    <line x1="145" y1="216" x2="175" y2="216"/>
    <line x1="337" y1="216" x2="367" y2="216"/>
    <line x1="178" y1="138" x2="200" y2="160"/>
    <line x1="312" y1="272" x2="334" y2="294"/>
    <line x1="334" y1="138" x2="312" y2="160"/>
    <line x1="200" y1="272" x2="178" y2="294"/>
  </g>

  <!-- Christian Cross with Gold Gradient & Glow -->
  <g filter="url(#goldGlow)">
    <!-- Vertical Cross Beam -->
    <rect x="230" y="88" width="52" height="276" rx="10" ry="10" fill="url(#tcongGold)"/>
    <!-- Horizontal Cross Beam -->
    <rect x="150" y="188" width="212" height="52" rx="10" ry="10" fill="url(#tcongGold)"/>
  </g>

  <!-- Divine Sparkle at the Cross Center -->
  <polygon points="256,192 262,210 280,214 262,218 256,236 250,218 232,214 250,210" fill="#FFFFFF"/>

  <!-- Ministry Acronym Banner at Bottom -->
  <g>
    <rect x="136" y="388" width="240" height="44" rx="22" ry="22" fill="#1E1B4B" stroke="url(#tcongGold)" stroke-width="2.5" opacity="0.95"/>
    <text x="256" y="418" font-family="'Outfit', 'Plus Jakarta Sans', system-ui, sans-serif" font-size="22" font-weight="800" fill="#FEF08A" text-anchor="middle" letter-spacing="4">T C O N G</text>
  </g>
</svg>
